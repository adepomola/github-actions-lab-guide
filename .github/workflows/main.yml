name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Display Node.js Version
        run: node -v

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Use Repository Secret
        run: echo "${{ secrets.MY_SECRET }}"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Linter
        run: echo "Linting completed successfully!"